# Model roles, with the measurements that chose them.
#
# Latency on qwen3.7-flash is close to linear in reasoning tokens:
# roughly 10ms per reasoning token plus ~0.8s of fixed overhead. So the
# reasoning budget is a predictable latency dial, and a *bounded budget* is
# the right knob - not an effort level.
#
#   budget    p50     max     out
#   default   12.8s   15.6s   1331
#   low       11.8s   13.4s   1424   <- slower than default; do not use
#   512       5.6s    6.0s     518
#   256       3.1s    3.7s     262   <- planner
#   128       2.1s    2.3s     134
#   off       0.9s    1.4s       1
#
# At budgets 32-256 qwen chose the same actions mistral-nemo chose with no
# reasoning at all, on the decision points tested. Most decisions in a duel
# are near-forced, which is the whole reason for splitting the roles.

executor:
  # Mechanical decisions, and plan steps the tracker could not take alone.
  #
  # Same model and the same thinking setting as the planner, deliberately.
  # Two families cannot share a prompt cache, and two different thinking
  # settings make a comparison measure two things at once.
  #
  # Thinking is left at the model's default - no `reasoning` block at all.
  # An explicit budget is what broke qwen: the agent passed
  # `reasoning: {max_tokens: 1024}` while this role capped output at 64, and
  # Alibaba rejected it outright - "max_completion_tokens [64] must be greater
  # than thinking_budget [1024]". mistral-nemo had silently ignored the
  # parameter because it does not think at all.
  model: qwen/qwen3.7-flash
  # Room for the thinking *and* the answer. A thinking model given 64 tokens
  # spends them all reasoning and returns empty content.
  max_tokens: 8192

planner:
  # Turn start, after every opponent interruption, and - since the menu-shape
  # triggers - any interrupt window, activation choice or wide menu. Puzzles
  # route every decision here.
  model: qwen/qwen3.7-flash
  # No `reasoning` block, so the model thinks for as long as it wants. The
  # 256-token budget below was chosen when the planner fired a few times a
  # turn and latency was the binding cost. It is not the binding cost on a
  # puzzle: one short paragraph of thinking to find a multi-step OTK is the
  # obvious thing to try removing, and five rounds of feeding the agent more
  # information did not move the solve rate.
  #   previously: reasoning: {max_tokens: 256}  -> 3.1s p50, 262 output tokens
  #   default:                                  -> 12.8s p50, 1331 output tokens
  preset: openrouter
  # Reasoning tokens count against max_tokens on OpenRouter, so this has to
  # clear the thinking *and* the answer. At 2048 an unbounded reasoner spends
  # the whole budget thinking and returns empty content, which the agent reads
  # as an unparseable reply and silently falls back to option 0.
  # Measured: the planning call alone reasons past 7,200 tokens on a real
  # puzzle and was being cut off mid-sentence at 8192, returning empty content
  # - on Seto VS Ishizu it had already worked out a winning line and the cap
  # threw it away. Reasoning counts against max_tokens here, so this has to
  # clear the thinking and the answer together.
  max_tokens: 32768

smoke:
  # Free, for plumbing tests that should cost nothing.
  model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
  preset: openrouter
  max_tokens: 2048
